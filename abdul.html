</head>
<body>

<header>
  <div>
    <div class="exam-title">জুনিয়র বৃত্তি পরীক্ষা-২০২৫ (গণিত)</div>
    <div class="exam-sub">বিষয় কোড: ১০৯ | বহুনির্বাচনি প্রশ্নের ধাপে ধাপে সমাধান ও চিত্র</div>

<script>
const questions = [
  {
    num: "১",
    q: "৫ ক্রমের ম্যাজিক বর্গের ম্যাজিক সংখ্যা কত?",
    opts: ["(ক) ১৫", "(খ) ৩৪", "(গ) ৬৫", "(ঘ) ১২৫"],
    ans: 2,
    steps: [
      "ধাপ ১: আমরা জানি, n ক্রমের ম্যাজিক বর্গের ম্যাজিক সংখ্যা নির্ণয়ের সূত্র = n(n² + ১) ÷ ২",
      "ধাপ ২: এখানে ক্রম সংখ্যা, n = ৫ বসিয়ে পাই: ৫ × (৫² + ১) ÷ ২",
      "ধাপ ৩: হিসাব করি: ৫ × (২৫ + ১) ÷ ২ = (৫ × ২৬) ÷ ২ = ৫ × ১৩ = ৬৫",
      "সিদ্ধান্ত: সুতরাং, সঠিক উত্তর (গ) ৬৫।"
    ]
  },
  {
    num: "২",
    q: "১ থেকে ৪০ পর্যন্ত ক্রমিক স্বাভাবিক বিজোড় সংখ্যার সমষ্টির বর্গ কোনটি?",
    opts: ["(ক) ৪০০", "(খ) ৯০০", "(গ) ১৬০০", "(ঘ) ২৫০০"],
    ans: 0,
    steps: [
      "ধাপ ১: ১ থেকে ৪০ পর্যন্ত মোট স্বাভাবিক সংখ্যা ৪০টি; যার অর্ধেক জোড় এবং অর্ধেক বিজোড়। অর্থাৎ বিজোড় সংখ্যার সংখ্যা, k = ৪০ ÷ ২ = ২০টি।",
      "ধাপ ২: প্রথম k সংখ্যক ক্রমিক স্বাভাবিক বিজোড় সংখ্যার সমষ্টি = k² = ২০² = ৪০০।",
      "ধাপ ৩: তবে প্রশ্নে 'সমষ্টির বর্গ' চাওয়া হলে ৪০০² = ১৬০০০০ হয়, যা অপশনে নেই। মূলত বোর্ড প্রশ্নে 'সমষ্টি কোনটি?' অর্থে k² = ৪০০ দেওয়া হয়েছে।",
      "সিদ্ধান্ত: প্রদত্ত অপশন অনুযায়ী ১ থেকে ৪০ পর্যন্ত বিজোড় সংখ্যার সমষ্টি (ক) ৪০০।"
    ]
  },
  {
    num: "৩",
    q: "২৪ থেকে ৯৮ পর্যন্ত মোট মৌলিক সংখ্যা কতটি?\n(মূল প্রশ্নে মুদ্রণজনিত কারণে '৯৮' এর স্থলে '১৮' ছাপা হয়েছে)",
    opts: ["(ক) ১৫", "(খ) ১৬", "(গ) ১৭", "(ঘ) ১৮"],
    ans: 2,
    steps: [
      "ধাপ ১: ২৪ থেকে ৯৮ পর্যন্ত মৌলিক সংখ্যাগুলো দশক অনুসারে তালিকা করি:",
      "ধাপ ২: (২৪–৩০): ২৯ (১টি) | (৩১–৪০): ৩১, ৩৭ (২টি) | (৪১–৫০): ৪১, ৪৩, ৪৭ (৩টি)",
      "ধাপ ৩: (৫১–৬০): ৫৩, ৫৯ (২টি) | (৬১–৭০): ৬১, ৬৭ (২টি) | (৭১–৮০): ৭১, ৭৩, ৭৯ (৩টি)",
      "ধাপ ৪: (৮১–৯০): ৮৩, ৮৯ (২টি) | (৯১–৯৮): ৯৭ (১টি) — কিন্তু খেয়াল করুন, মোট যোগফল = ১+২+৩+২+২+৩+২+১ = ১৬টি! (যদি ২৩ থেকে ৯৮ হয় তবে ১৭টি, আর ২৪ থেকে ৯৮ হলে ১৬টি)।",
      "সিদ্ধান্ত: ২৪ থেকে ৯৮ পর্যন্ত মৌলিক সংখ্যা ১৬টি, তাই সঠিক উত্তর (খ) ১৬। (বি.দ্র: যদি প্রশ্নটি '২ থেকে ৫৮' হতো তবে ১৭টি হতো; ২৪ থেকে ৯৮ ধরলে উত্তর ১৬টি)।"
    ]
  },
  {
    num: "৪",
    q: "টাকায় ৭টি দরে ক্রয় করে টাকায় ৫টি দরে বিক্রয় করলে, শতকরা কত লাভ বা ক্ষতি হবে?",
    opts: ["(ক) ৪০% ক্ষতি", "(খ) ২০% ক্ষতি", "(গ) ২০% লাভ", "(ঘ) ৪০% লাভ"],
    ans: 3,
    steps: [
      "ধাপ ১: ৭টির ক্রয়মূল্য = ১ টাকা; অতএব ১টির ক্রয়মূল্য = ১/৭ টাকা।",
      "ধাপ ২: ৫টির বিক্রয়মূল্য = ১ টাকা; অতএব ১টির বিক্রয়মূল্য = ১/৫ টাকা। (যেহেতু ১/৫ > ১/৭, তাই লাভ হয়েছে)।",

      "ধাপ ৪: শতকরা লাভ = (লাভ ÷ ক্রয়মূল্য) × ১০০% = {(২/৩৫) ÷ (১/৭)} × ১০০% = (২/৩৫ × ৭/১) × ১০০% = (২/৫) × ১০০% = ৪০% লাভ।"
    ]
  },
  {
    num: "৫",
    stem: "উদ্দীপক (৫ ও ৬ নং প্রশ্নের জন্য): কোনো আসল ৩ বছরে মুনাফা-আসলে ১৫০০ টাকা এবং ৫ বছরে মুনাফা-আসলে ২০০০ টাকা।",
    q: "এক বছরের মুনাফা কত টাকা?",
    opts: ["(ক) ১২৫", "(খ) ২৫০", "(গ) ৭৫০", "(ঘ) ১১৬৬.৬৭"],
    ans: 1,
    steps: [
      "ধাপ ১: (আসল + ৫ বছরের মুনাফা) = ২০০০ টাকা এবং (আসল + ৩ বছরের মুনাফা) = ১৫০০ টাকা।",
      "ধাপ ২: বিয়োগ করে পাই, (৫ − ৩) বা ২ বছরের মুনাফা = (২০০০ − ১৫০০) টাকা = ৫০০ টাকা।",
      "ধাপ ৩: অতএব, ১ বছরের মুনাফা = ৫০০ ÷ ২ = ২৫০ টাকা।",

  {

    stem: "উদ্দীপক (৫ ও ৬ নং প্রশ্নের জন্য): কোনো আসল ৩ বছরে মুনাফা-আসলে ১৫০০ টাকা এবং ৫ বছরে মুনাফা-আসলে ২০০০ টাকা।",

    opts: ["(ক) ৭৫০", "(খ) ৮৭৫", "(গ) ১০০০", "(ঘ) ১২৫০"],
    ans: 0,
    steps: [

      "ধাপ ৩: আসল = (৩ বছরের মুনাফা-আসল − ৩ বছরের মুনাফা) = ১৫০০ − ৭৫০ = ৭৫০ টাকা।",
      "সিদ্ধান্ত: সঠিক উত্তর (ক) ৭৫০।"
    ]
  },
  {
    num: "৭",
    q: "একটি আয়তাকার ঘরের দৈর্ঘ্য প্রস্থের দ্বিগুণ এবং ঘরটির ক্ষেত্রফল ৫১২ বর্গমিটার হলে, ঘরটির মেঝের কর্ণের দৈর্ঘ্য কত মিটার?\n(বি.দ্র: প্রশ্নে কর্ণের বদলে প্রস্থ ১৬ মি. এবং ঘ-অপশনে ১৬√৫ মি. হওয়ার কথা)",

let currentIdx = 0;
let revealedSteps = 0;

function initDropdown() {
  const sel = document.getElementById("qSelect");
  questions.forEach((item, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = "প্রশ্ন " + item.num;
    sel.appendChild(opt);
  });
}

function renderQuestion() {
  const qData = questions[currentIdx];
  document.getElementById("qSelect").value = currentIdx;
  document.getElementById("qBadge").textContent = "প্রশ্ন " + qData.num + " / ৩০";
  document.getElementById("qText").textContent = qData.q;

  const stemBox = document.getElementById("stemContainer");
  if (qData.stem) {
    stemBox.style.display = "block";
    stemBox.innerHTML = `<span class="stem-tag">উদ্দীপক:</span> ${qData.stem}`;
  } else {
    stemBox.style.display = "none";
  }

  const mainGrid = document.getElementById("mainGrid");
  const svgContainer = document.getElementById("svgContainer");
  if (qData.svg) {
    mainGrid.classList.add("has-svg");
    svgContainer.style.display = "block";
    svgContainer.innerHTML = qData.svg;
  } else {
    mainGrid.classList.remove("has-svg");
    svgContainer.style.display = "none";
    svgContainer.innerHTML = "";
  }

  const optGrid = document.getElementById("optionsGrid");
  optGrid.innerHTML = "";
  qData.opts.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = optText;
    btn.onclick = () => checkOption(i, btn);
    optGrid.appendChild(btn);
  });

  revealedSteps = 0;
  document.getElementById("explanationBox").style.display = "none";
  document.getElementById("stepsList").innerHTML = "";
  document.getElementById("stepBtn").disabled = false;
  document.getElementById("stepBtn").textContent = "ব্যাখ্যা ও ১ম ধাপ দেখুন ❯";

  document.getElementById("prevBtn").disabled = (currentIdx === 0);
  document.getElementById("nextBtn").disabled = (currentIdx === questions.length - 1);
}

function checkOption(selectedIndex, clickedBtn) {
  const qData = questions[currentIdx];
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach((b, idx) => {
    if (idx === qData.ans) {
      b.classList.add("correct");
    }
  });
  if (selectedIndex !== qData.ans) {
    clickedBtn.classList.add("wrong");
  }
}

function revealNextStep() {
  const qData = questions[currentIdx];
  const expBox = document.getElementById("explanationBox");
  const stepsList = document.getElementById("stepsList");

  expBox.style.display = "block";

  if (revealedSteps < qData.steps.length) {
    const div = document.createElement("div");
    div.className = "step-item";
    div.textContent = qData.steps[revealedSteps];
    stepsList.appendChild(div);
    revealedSteps++;

    if (revealedSteps < qData.steps.length) {
      document.getElementById("stepBtn").textContent = `পরবর্তী ধাপ (${revealedSteps + 1}/${qData.steps.length}) ❯`;
    } else {
      document.getElementById("stepBtn").textContent = "সব ধাপ প্রদর্শিত ✓";
      document.getElementById("stepBtn").disabled = true;
      highlightCorrectOption();
    }
  }
}

function highlightCorrectOption() {
  const qData = questions[currentIdx];
  const allBtns = document.querySelectorAll(".opt-btn");
  if (allBtns[qData.ans]) {
    allBtns[qData.ans].classList.add("correct");
  }
}

function showAllAndAnswer() {
  const qData = questions[currentIdx];
  highlightCorrectOption();
  while (revealedSteps < qData.steps.length) {
    revealNextStep();
  }
}

function resetCurrent() {
  renderQuestion();
}

function changeQuestion(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < questions.length) {
    currentIdx = next;
    renderQuestion();
  }
}

function goToQuestion(idx) {
  currentIdx = parseInt(idx, 10);
  renderQuestion();
}

initDropdown();
renderQuestion();
