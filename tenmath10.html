<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দূরত্ব ও উচ্চতা - দশম শ্রেণি গণিত (অধ্যায় ১০)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'SolaimanLipi', 'Kalpurush';
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h2 {
            font-size: 1.1rem;
            color: var(--secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header h1 {
            font-size: 1.8rem;
            margin-top: 5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Progress Bar */
        .progress-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 6.66%;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Card Container */
        .card-wrapper {
            position: relative;
            min-height: 250px;
            perspective: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            animation: slideIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .badge {
            align-self: flex-start;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .question {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.5;
            color: #ffffff;
        }

        .answer-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--secondary);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            margin-top: 10px;
            animation: fadeIn 0.4s ease forwards;
        }

        .answer-title {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .answer-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .btn-primary {
            background: var(--primary);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-toggle {
            background: transparent;
            border: 1px dashed var(--secondary);
            color: var(--secondary);
        }

        .btn-toggle:hover {
            background: rgba(6, 182, 212, 0.1);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        /* Pulse Animation for Play Button */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .playing {
            animation: pulse 1.5s infinite;
            background: #059669 !important;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .question { font-size: 1.1rem; }
            .controls { justify-content: center; }
            .btn-group { width: 100%; justify-content: space-between; }
            button { flex: 1; justify-content: center; padding: 10px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>শ্রেণি: দশম | বিষয়: গণিত</h2>
            <h1>অধ্যায় ১০: দূরত্ব ও উচ্চতা</h1>
        </header>

        <!-- Progress Indicator -->
        <div class="progress-box">
            <span id="counter">প্রশ্ন: ১ / ১৫</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <span id="percentage">৭%</span>
        </div>

        <!-- Question & Answer Dynamic Card -->
        <div class="card-wrapper">
            <div class="card" id="qaCard">
                <span class="badge" id="categoryBadge">NCTB সংক্ষিপ্ত প্রশ্ন</span>
                <div class="question" id="questionText">লোড হচ্ছে...</div>
                <div class="answer-box" id="answerBox">
                    <div class="answer-title">ব্যাখ্যা সহ উত্তর:</div>
                    <div class="answer-text" id="answerText">লোড হচ্ছে...</div>
                </div>
            </div>
        </div>

        <!-- Interactive Controls -->
        <div class="controls">
            <button class="btn-toggle" id="autoPlayBtn" onclick="toggleAutoPlay()">
                ▶ অটো প্লে (Auto Play)
            </button>
            <div class="btn-group">
                <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>
                    ❮ পূর্ববর্তী
                </button>
                <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">
                    পরবর্তী ❯
                </button>
            </div>
        </div>
    </div>

    <footer>
        NCTB কারিকুলাম অনুযায়ী প্রস্তুতকৃত • স্মার্ট রিভিশন ড্যাশবোর্ড
    </footer>

    <script>
        // NCTB Class 10 Math Chapter 10 Data
        const questionsData = [
            {
                q: "১. ভূ-রেখা (Horizontal Line) কাকে বলে?",
                a: "ভূমি তলে অবস্থিত যেকোনো সরলরেখাকে ভূ-রেখা বলে। একে অনেক সময় 'শয়ন রেখা'-ও বলা হয়ে থাকে।"
            },
            {
                q: "২. ঊর্ধ্বরেখা (Vertical Line) বলতে কী বোঝায়?",
                a: "ভূমি তলের ওপর লম্ব যেকোনো সরলরেখাকে ঊর্ধ্বরেখা বা উলম্ব রেখা বলা হয়।"
            },
            {
                q: "৩. উলম্ব তল (Vertical Plane) কাকে বলে?",
                a: "পরস্পরচ্ছেদী ভূ-রেখা ও ঊর্ধ্বরেখা যে সমতল গঠন করে, তাকে উলম্ব তল বলা হয়।"
            },
            {
                q: "৪. উন্নতি কোণ (Angle of Elevation) কাকে বলে?",
                a: "ভূতলের উপরের কোনো বিন্দু ভূমির সমান্তরাল রেখার সাথে যে কোণ উৎপন্ন করে, তাকে উন্নতি কোণ বলা হয়।"
            },
            {
                q: "৫. অবনতি কোণ (Angle of Depression) বলতে কী বোঝায়?",
                a: "ভূতলের সমান্তরাল রেখার নিচের কোনো বিন্দু ভূ-রেখার সাথে যে কোণ তৈরি করে, তাকে অবনতি কোণ বলে।"
            },
            {
                q: "৬. উন্নতি কোণ ও অবনতি কোণের মধ্যকার সম্পর্ক কী?",
                a: "দৃষ্টিরেখা একই থাকলে উন্নতি কোণ ও অবনতি কোণ পরস্পর একান্তর কোণ হওয়ায় এরা একে অপরের সমান হয়।"
            },
            {
                q: "৭. উন্নতি কোণ ৩০° হলে চিত্র আঁকার ক্ষেত্রে লম্ব ও ভূমির সম্পর্ক কেমন হবে?",
                a: "লম্ব < ভূমি হবে (অর্থাৎ ভূমি বড় হবে)। কারণ tan 30° = 1/√3 ≈ 0.577, যা ১-এর চেয়ে ছোট।"
            },
            {
                q: "৮. উন্নতি কোণ ৪৫° হলে লম্ব ও ভূমির দৈর্ঘ্য কেমন হবে?",
                a: "লম্ব = ভূমি হবে। কারণ tan 45° = 1, ফলে সমকোণী ত্রিভুজের লম্ব ও ভূমির দৈর্ঘ্য সমান হয়।"
            },
            {
                q: "৯. উন্নতি কোণ ৬০° হলে লম্ব ও ভূমির সম্পর্ক কীরূপ হবে?",
                a: "লম্ব > ভূমি হবে (অর্থাৎ লম্ব বড় হবে)। কারণ tan 60° = √3 ≈ 1.732, যা ১-এর চেয়ে বড়।"
            },
            {
                q: "১০. একটি মিনারের উচ্চতা এবং এর ছায়ার দৈর্ঘ্য সমান হলে সূর্যের উন্নতি কোণ কত?",
                a: "সূর্যের উন্নতি কোণ হবে ৪৫°। কারণ tan θ = লম্ব/ভূমি = ১/১ = ১ = tan 45°, সুতরাং θ = ৪৫°।"
            },
            {
                q: "১১. দূরত্ব ও উচ্চতা সংক্রান্ত গাণিতিক সমস্যায় সবচেয়ে বেশি কোন ত্রিকোণমিতিক অনুপাত ব্যবহৃত হয়?",
                a: "tan অনুপাত (tan θ = লম্ব/ভূমি)। কারণ বেশিরভাগ ক্ষেত্রেই উন্নতি কোণ এবং অনুভূমিক দূরত্বের সাপেক্ষে উচ্চতা বের করতে হয়।"
            },
            {
                q: "১২. কোনো খুঁটির শীর্ষবিন্দুর উন্নতি কোণ ৬০° এবং পাদদেশ থেকে বিন্দুর দূরত্ব ১০ মিটার হলে খুঁটিটির উচ্চতা কত?",
                a: "উচ্চতা = ১০√৩ মিটার (বা ১৭.৩২ মিটার প্রায়)। ব্যাখ্যা: tan 60° = h / 10 ⟹ √3 = h / 10 ⟹ h = 10√3।"
            },
            {
                q: "১৩. থিওডোলাইট (Theodolite) কী কাজে ব্যবহৃত হয়?",
                a: "থিওডোলাইট হলো একটি বিশেষ জরিপ যন্ত্র, যার মাধ্যমে ভূমি বা দূরবর্তী স্থানের অনুভূমিক ও উলম্ব কোণ নিখুঁতভাবে পরিমাপ করা হয়।"
            },
            {
                q: "১৪. একটি মই দেওয়ালের সাথে ৬০° কোণ করে আছে। মইটির গোড়া দেওয়াল থেকে ৪ মিটার দূরে থাকলে মইটির দৈর্ঘ্য কত?",
                a: "মইটির দৈর্ঘ্য ৮ মিটার। কারণ cos 60° = ভূমি/অতিভুজ ⟹ 1/2 = 4/মই ⟹ মই = ৮ মিটার।"
            },
            {
                q: "১৫. অবনতি কোণ সর্বদা কার সাপেক্ষে পরিমাপ করা হয়?",
                a: "অবনতি কোণ সর্বদা পর্যবেক্ষকের চোখ বরাবর ভূমির সমান্তরাল কাল্পনিক রেখার নিচের দিকে পরিমাপ করা হয়।"
            }
        ];

        let currentIndex = 0;
        let autoPlayTimer = null;

        // Elements
        const questionText = document.getElementById("questionText");
        const answerText = document.getElementById("answerText");
        const counter = document.getElementById("counter");
        const percentage = document.getElementById("percentage");
        const progressFill = document.getElementById("progressFill");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const qaCard = document.getElementById("qaCard");
        const autoPlayBtn = document.getElementById("autoPlayBtn");

        // Convert number to Bengali
        function toBengaliNumber(num) {
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            return num.toString().split('').map(d => bnDigits[d] || d).join('');
        }

        // Render Current Question
        function updateUI() {
            // Trigger animation
            qaCard.style.animation = 'none';
            qaCard.offsetHeight; // trigger reflow
            qaCard.style.animation = 'slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards';

            // Set Data
            const currentItem = questionsData[currentIndex];
            questionText.innerText = currentItem.q;
            answerText.innerText = currentItem.a;

            // Progress Update
            const total = questionsData.length;
            const currentNumber = currentIndex + 1;
            const progressPercent = Math.round((currentNumber / total) * 100);

            counter.innerText = `প্রশ্ন: ${toBengaliNumber(currentNumber)} / ${toBengaliNumber(total)}`;
            percentage.innerText = `${toBengaliNumber(progressPercent)}%`;
            progressFill.style.width = `${progressPercent}%`;

            // Button States
            prevBtn.disabled = currentIndex === 0;
            if (currentIndex === total - 1) {
                nextBtn.innerText = "পুনরায় শুরু ↺";
            } else {
                nextBtn.innerText = "পরবর্তী ❯";
            }
        }

        // Navigation Functions
        function nextQuestion() {
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Loop back
            }
            updateUI();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        }

        // Auto Play Feature
        function toggleAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
                autoPlayBtn.innerHTML = "▶ অটো প্লে (Auto Play)";
                autoPlayBtn.classList.remove('playing');
            } else {
                autoPlayBtn.innerHTML = "⏸ থামান (Pause)";
                autoPlayBtn.classList.add('playing');
                autoPlayTimer = setInterval(() => {
                    nextQuestion();
                }, 4000); // changes card every 4 seconds
            }
        }

        // Keyboard navigation (Arrow keys)
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextQuestion();
            if (e.key === "ArrowLeft") prevQuestion();
        });

        // Initialize on load
        updateUI();
    </script>
</body>
</html>
