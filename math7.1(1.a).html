<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ত্রিভুজ অঙ্কন সম্পাদ্য অ্যানিমেশন</title>
  <style>
    body {
      font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', Tahoma, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 820px;
      padding: 20px 25px;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #1a365d;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #4a5568;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .svg-container {
      background-color: #fafbfc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    svg {
      width: 100%;
      height: 400px;
    }
    .instruction-box {
      margin-top: 15px;
      padding: 12px 18px;
      background: #eef2ff;
      border-left: 5px solid #4f46e5;
      border-radius: 4px;
      font-size: 17px;
      color: #1e1b4b;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #4338ca;
    }
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    .step-badge {
      font-weight: bold;
      margin-right: 8px;
    }
    /* SVG Styling */
    .line-draw {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw 1s ease forwards;
    }
    .arc-draw {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: draw 0.8s ease forwards;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    .triangle-fill {
      animation: fillIn 0.8s ease forwards;
    }
    @keyframes fillIn {
      from { fill-opacity: 0; }
      to { fill-opacity: 0.15; }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>জ্যামিতিক অঙ্কন: তিনটি বাহু দেওয়া আছে</h2>
  <p class="subtitle">তিনটি বাহুর দৈর্ঘ্য: $a = ৩\text{ সে.মি.}$, $b = ৩.৫\text{ সে.মি.}$, $c = ২.৮\text{ সে.মি.}$</p>

  <div class="svg-container">
    <svg id="geoSvg" viewBox="0 0 750 380">
      <defs>
        <!-- Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1f2937" />
        </marker>
      </defs>

      <!-- Given Data (Top Left) -->
      <g id="given-data">
        <!-- a = 3 cm (180px) -->
        <line x1="60" y1="40" x2="240" y2="40" stroke="#1f2937" stroke-width="2" />
        <text x="45" y="44" font-size="15" font-weight="bold">a</text>
        <text x="120" y="32" font-size="13" fill="#4b5563">৩ সে.মি.</text>

        <!-- b = 3.5 cm (210px) -->
        <line x1="60" y1="75" x2="270" y2="75" stroke="#1f2937" stroke-width="2" />
        <text x="45" y="79" font-size="15" font-weight="bold">b</text>
        <text x="135" y="67" font-size="13" fill="#4b5563">৩.৫ সে.মি.</text>

        <!-- c = 2.8 cm (168px) -->
        <line x1="60" y1="110" x2="228" y2="110" stroke="#1f2937" stroke-width="2" />
        <text x="45" y="114" font-size="15" font-weight="bold">c</text>
        <text x="114" y="102" font-size="13" fill="#4b5563">২.৮ সে.মি.</text>
      </g>

      <!-- Step Elements Container -->
      <g id="drawing-area"></g>
    </svg>
  </div>

  <div class="instruction-box" id="instructionBox">
    <span class="step-badge">প্রস্তুতি:</span> তিনটি বাহু $a, b, c$ দেওয়া আছে। "পরবর্তী ধাপ" বাটনে চাপুন।
  </div>

  <div class="btn-group">
    <button id="prevBtn" onclick="prevStep()" disabled>পূর্ববর্তী ধাপ</button>
    <button id="nextBtn" onclick="nextStep()">পরবর্তী ধাপ</button>
    <button id="resetBtn" onclick="resetSteps()" style="background-color: #ef4444;">রিসেট</button>
  </div>
</div>

<script>
  // Mathematical Geometry Points:
  // Base B=(220, 320), C=(400, 320) => a = 180px (3 cm)
  // b = 210px (3.5 cm), c = 168px (2.8 cm)
  // Calculated intersection point A = (354, 158)
  const stepsData = [
    {
      text: '<span class="step-badge">প্রস্তুতি:</span> উদ্দীপকে তিনটি বাহুর পরিমাপ দেওয়া আছে: $a = ৩\\text{ সে.মি.}$, $b = ৩.৫\\text{ সে.মি.}$ এবং $c = ২.৮\\text{ সে.মি.}$।',
      render: () => ``
    },
    {
      text: '<span class="step-badge">ধাপ ১:</span> যেকোনো একটি রশ্মি $BE$ আঁকি।',
      render: () => `
        <line x1="220" y1="320" x2="620" y2="320" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)" class="line-draw" />
        <circle cx="220" cy="320" r="4" fill="#1f2937" />
        <text x="210" y="345" font-size="18" font-weight="bold">B</text>
        <text x="625" y="325" font-size="18" font-weight="bold">E</text>
      `
    },
    {
      text: '<span class="step-badge">ধাপ ২:</span> $BE$ থেকে বাহু $a$-এর সমান করে $BC = ৩\\text{ সে.মি.}$ কেটে নিই।',
      render: () => `
        <!-- Arc on ray BE -->
        <path d="M 400 305 A 20 20 0 0 1 405 335" stroke="#dc2626" stroke-width="2" fill="none" class="arc-draw" />
        <circle cx="400" cy="320" r="4" fill="#dc2626" />
        <line x1="220" y1="320" x2="400" y2="320" stroke="#2563eb" stroke-width="3" />
        <text x="395" y="345" font-size="18" font-weight="bold">C</text>
        <text x="305" y="345" font-size="16" fill="#1e40af" font-weight="bold">a</text>
      `
    },
    {
      text: '<span class="step-badge">ধাপ ৩:</span> $B$ বিন্দুকে কেন্দ্র করে $b = ৩.৫\\text{ সে.মি.}$-এর সমান ব্যাসার্ধ নিয়ে $BC$-এর উপরের পাশে একটি বৃত্তচাপ আঁকি।',
      render: () => `
        <!-- Arc with radius 210 from B(220, 320) near A(354, 158) -->
        <path d="M 330 140 A 210 210 0 0 1 385 185" stroke="#ea580c" stroke-width="2.2" fill="none" class="arc-draw" />
      `
    },
    {
      text: '<span class="step-badge">ধাপ ৪:</span> $C$ বিন্দুকে কেন্দ্র করে $c = ২.৮\\text{ সে.মি.}$-এর সমান ব্যাসার্ধ নিয়ে অপর একটি বৃত্তচাপ আঁকি, যা পূর্বের চাপকে $A$ বিন্দুতে ছেদ করে।',
      render: () => `
        <!-- Arc with radius 168 from C(400, 320) near A(354, 158) -->
        <path d="M 375 140 A 168 168 0 0 0 330 185" stroke="#9333ea" stroke-width="2.2" fill="none" class="arc-draw" />
        <circle cx="354" cy="158" r="4.5" fill="#dc2626" />
        <text x="350" y="140" font-size="18" font-weight="bold">A</text>
      `
    },
    {
      text: '<span class="step-badge">ধাপ ৫:</span> $A, B$ এবং $A, C$ যোগ করি। তাহলে $\\triangle ABC$-ই উদ্দিষ্ট ত্রিভুজ।',
      render: () => `
        <!-- Triangle fill -->
        <polygon points="220,320 400,320 354,158" fill="#3b82f6" class="triangle-fill" />
        <!-- Triangle border lines -->
        <line x1="220" y1="320" x2="354" y2="158" stroke="#1f2937" stroke-width="2.8" class="line-draw" />
        <line x1="400" y1="320" x2="354" y2="158" stroke="#1f2937" stroke-width="2.8" class="line-draw" />
        <!-- Labels -->
        <text x="270" y="230" font-size="16" fill="#1f2937" font-weight="bold">b</text>
        <text x="390" y="240" font-size="16" fill="#1f2937" font-weight="bold">c</text>
      `
    }
  ];

  let currentStep = 0;
  const drawingArea = document.getElementById("drawing-area");
  const instructionBox = document.getElementById("instructionBox");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  function updateView() {
    let combinedSVG = "";
    for (let i = 1; i <= currentStep; i++) {
      combinedSVG += stepsData[i].render();
    }
    drawingArea.innerHTML = combinedSVG;
    instructionBox.innerHTML = stepsData[currentStep].text;

    prevBtn.disabled = (currentStep === 0);
    nextBtn.disabled = (currentStep === stepsData.length - 1);
  }

  function nextStep() {
    if (currentStep < stepsData.length - 1) {
      currentStep++;
      updateView();
    }
  }

  function prevStep() {
    if (currentStep > 0) {
      currentStep--;
      updateView();
    }
  }

  function resetSteps() {
    currentStep = 0;
    updateView();
  }

  // Initial call
  updateView();
</script>
</body>
</html>
