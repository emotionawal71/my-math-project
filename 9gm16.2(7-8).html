<!DOCTYPE html>
<html lang="bn">
<head>

  <title>পরিমিতি: সামান্তরিক ও বর্গক্ষেত্রের সমাধান</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0d9488;
      --accent: #e11d48;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SolaimanLipi', 'Kalpurush', 'Noto Sans Bengali', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: white;
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 8.33%;
      transition: width 0.3s ease;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .main-content {
        flex-direction: row;
        align-items: center;
      }
    }

    .diagram-panel {
      flex: 1.1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #cbd5e1;
      min-height: 280px;
    }

    svg {
      width: 100%;
      max-width: 440px;
      height: auto;
    }

    .slide-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 320px;
      padding: 10px;
    }

    .step-badge {
      display: inline-block;
      align-self: flex-start;
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .step-title {
      font-size: 1.15rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 700;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
    }

    .step-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #334155;
    }

    .formula-box {
      background: #f8fafc;
      border-left: 4px solid var(--secondary);
      padding: 10px 14px;
      margin: 10px 0;
      border-radius: 4px;
      font-weight: 500;
    }

    .highlight {
      color: var(--accent);
      font-weight: bold;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      margin-top: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .shape-diag { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 4; }
    .text-dim { font-size: 13px; fill: #1e293b; font-weight: 600; }

</head>

    const bnNums = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().split('').map(d => bnNums[d] || d).join('');
  }

  function updateSlide() {
    const s = slides[currentSlide];

    // হেডার ও টেক্সট আপডেট
    document.getElementById("headerTopic").textContent = s.header;
    document.getElementById("stepCounter").textContent = "ধাপ: " + toBengaliNum(s.step) + " / ১২";
    document.getElementById("slideTitle").innerHTML = s.title;
    document.getElementById("slideBody").innerHTML = s.body;

    // প্রগ্রেস বার
    const percent = ((currentSlide + 1) / slides.length) * 100;
    document.getElementById("progressBar").style.width = percent + "%";

    // বাটন স্থিতি
    document.getElementById("prevBtn").disabled = (currentSlide === 0);
    document.getElementById("nextBtn").disabled = (currentSlide === slides.length - 1);

    // এসভিজি চিত্র পরিবর্তন
    if (s.showSvg === 7) {
      document.getElementById("svgProblem7").style.display = "block";
      document.getElementById("svgProblem8").style.display = "none";
    } else {
      document.getElementById("svgProblem7").style.display = "none";
      document.getElementById("svgProblem8").style.display = "block";
    }

    s.updateSvg();
  }

  function nextSlide() {
    if (currentSlide < slides.length - 1) {
      currentSlide++;
      updateSlide();
    } else if (autoPlayTimer) {
      toggleAutoPlay();
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      updateSlide();
    }
  }

  function toggleAutoPlay() {
    const playBtn = document.getElementById("playBtn");
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      playBtn.textContent = "স্বয়ংক্রিয় চালু";
      playBtn.style.background = "var(--muted)";
    } else {
      playBtn.textContent = "থামুন";
      playBtn.style.background = "#e11d48";
      autoPlayTimer = setInterval(() => {
        if (currentSlide < slides.length - 1) {
          nextSlide();
        } else {
          toggleAutoPlay();
        }
      }, 3500);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  // আরম্ভ
  updateSlide();
</script>

</body>
