        "(গ) ২৫ টাকা",
        "(ঘ) ১৫ টাকা"
      ]
    },
    // 28
    {
      type: "answer",
      badge: "উত্তর ও ব্যাখ্যা - ১৪",
      correct: "সঠিক উত্তর: (খ) ২০ টাকা",
      detail: "ব্যাখ্যা: অনুপাতের রাশিগুলোর যোগফল = ৩ + ২ = ৫। পুত্রের অংশ = মোট টাকার ২/৫ অংশ = ৫০ এর ২/৫ = ২০ টাকা।"
    },
    // 29
    {
      type: "question",
      badge: "প্রশ্ন - ১৫",
      title: "একটি শ্রেণিতে মোট ৫০ জন শিক্ষার্থীর মধ্যে ৬০% ছাত্রী। ঐ শ্রেণিতে ছাত্রের সংখ্যা কত?",
      options: [
        "(ক) ৩০ জন",
        "(খ) ২০ জন",
        "(গ) ২৫ জন",
        "(ঘ) ৩৫ জন"
      ]
    },
    // 30
    {
      type: "answer",
      badge: "উত্তর ও ব্যাখ্যা - ১৫",
      correct: "সঠিক উত্তর: (খ) ২০ জন",
      detail: "ব্যাখ্যা: ছাত্রী সংখ্যা = ৫০ এর ৬০% = ৫০ × (৬০/১০০) = ৩০ জন। অতএব ছাত্রের সংখ্যা = ৫০ - ৩০ = ২০ জন। (অথবা, ছাত্রের শতকরা হার = ১০০% - ৬০% = ৪০%, ৫০ এর ৪০% = ২০ জন)।"
    }
  ];

  // Bengali Numerals Converter
  function toBengaliNumber(num) {
    const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().split('').map(d => bengaliDigits[d] || d).join('');
  }

  let currentSlide = 0;

  function renderSlide() {
    const slide = slides[currentSlide];
    const container = document.getElementById("slide-container");
    const slideNum = document.getElementById("slide-num");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    // Update Slide Counter
    slideNum.innerText = "স্লাইড: " + toBengaliNumber(currentSlide + 1) + " / ৩০";

    // Disable/Enable Nav Buttons
    prevBtn.disabled = currentSlide === 0;
    nextBtn.disabled = currentSlide === slides.length - 1;

    // Render Question or Explanation
    if (slide.type === "question") {
      container.innerHTML = `
        <div class="badge badge-q">${slide.badge}</div>
        <div class="content-title">${slide.title}</div>
        <div class="options-grid">
          <div class="option-card">${slide.options[0]}</div>
          <div class="option-card">${slide.options[1]}</div>
          <div class="option-card">${slide.options[2]}</div>
          <div class="option-card">${slide.options[3]}</div>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="badge badge-ans">${slide.badge}</div>
        <div class="explanation-box">
          <div class="correct-ans">${slide.correct}</div>
          <div class="exp-detail">${slide.detail}</div>
        </div>
      `;
    }
  }

  function nextSlide() {
    if (currentSlide < slides.length - 1) {
      currentSlide++;
      renderSlide();
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      renderSlide();
    }
  }

  // Keyboard navigation support (Arrow Keys)
  window.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight" || e.key === "Space") {
      nextSlide();
    } else if (e.key === "ArrowLeft") {
      prevSlide();
    }
  });

  // Initial load
  renderSlide();
</script>

</body>
</html>
