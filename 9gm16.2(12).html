<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ট্রাপিজিয়ামের ক্ষেত্রফল নির্ণয় - অ্যানিমেশন</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #f0f4f8;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .container {
      background: #ffffff;
      max-width: 900px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: #ffffff;
      padding: 18px 24px;
      text-align: center;
    }
    header h1 {
      font-size: 1.35rem;
      margin-bottom: 6px;
      font-weight: 700;
    }
    header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .progress-bar-container {
      background: #e2e8f0;
      height: 6px;
      width: 100%;
    }
    .progress-bar {
      background: #10b981;
      height: 100%;
      width: 10%;
      transition: width 0.3s ease;
    }
    .main-content {
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .main-content {
        flex-direction: row;
        align-items: center;
      }
    }
    .svg-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
    }
    svg {
      width: 100%;
      max-width: 420px;
      height: auto;
    }
    .explanation-area {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 280px;
      padding: 10px;
    }
    .slide-badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      border: 1px solid #bfdbfe;
      width: fit-content;
    }
    .slide-title {
      font-size: 1.2rem;
      color: #0f172a;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .slide-body {
      font-size: 1rem;
      line-height: 1.65;
      color: #334155;
    }
    .math-highlight {
      background: #f1f5f9;
      border-left: 4px solid #3b82f6;
      padding: 8px 12px;
      margin: 10px 0;
      border-radius: 4px;
      font-weight: 600;
      color: #0f172a;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 24px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    .step-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #cbd5e1;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active {
      background: #2563eb;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ট্রাপিজিয়ামের ক্ষেত্রফল নির্ণয়</h1>
    <p>সমান্তরাল বাহু 31 ও 11 সে.মি., অপর বাহুদ্বয় 10 ও 12 সে.মি.</p>
  </header>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="main-content">
    <div class="svg-area">
      <svg viewBox="0 0 460 260">
        <!-- Background grid/shapes -->
        <!-- Shaded areas -->
        <polygon id="shadeTrap" points="60,200 160,80 290,80 420,200" fill="#3b82f6" fill-opacity="0.08" stroke="none" />
        <polygon id="shadeAde" points="60,200 160,80 160,200" fill="#f59e0b" fill-opacity="0" />
        <polygon id="shadeBcf" points="290,200 290,80 420,200" fill="#10b981" fill-opacity="0" />
        <rect id="shadeCdef" x="160" y="80" width="130" height="120" fill="#8b5cf6" fill-opacity="0" />

        <!-- Trapezium Outer Lines -->
        <polygon id="trapOutline" points="60,200 160,80 290,80 420,200" fill="none" stroke="#1e293b" stroke-width="2.5" />

        <!-- Altitudes DE and CF -->
        <line id="lineDE" x1="160" y1="80" x2="160" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" opacity="0.2" />
        <line id="lineCF" x1="290" y1="80" x2="290" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" opacity="0.2" />

        <!-- Right angle markers -->
        <path id="rightE" d="M160,190 L170,190 L170,200" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0" />
        <path id="rightF" d="M290,190 L280,190 L280,200" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0" />

        <!-- Vertices labels -->
        <text x="45" y="215" font-weight="bold" fill="#0f172a" font-size="16">A</text>
        <text x="430" y="215" font-weight="bold" fill="#0f172a" font-size="16">B</text>
        <text x="295" y="70" font-weight="bold" fill="#0f172a" font-size="16">C</text>
        <text x="145" y="70" font-weight="bold" fill="#0f172a" font-size="16">D</text>
        <text id="lblE" x="155" y="222" font-weight="bold" fill="#ef4444" font-size="15" opacity="0.3">E</text>
        <text id="lblF" x="285" y="222" font-weight="bold" fill="#ef4444" font-size="15" opacity="0.3">F</text>

        <!-- Measurements labels -->
        <text id="lblCD" x="210" y="70" font-size="13" font-weight="bold" fill="#2563eb">11 সে.মি.</text>
        <text id="lblAD" x="80" y="135" font-size="13" font-weight="bold" fill="#2563eb">10 সে.মি.</text>
        <text id="lblBC" x="365" y="135" font-size="13" font-weight="bold" fill="#2563eb">12 সে.মি.</text>
        <text id="lblAB" x="220" y="245" font-size="13" font-weight="bold" fill="#2563eb">AB = 31 সে.মি.</text>

        <!-- Dimension dynamic texts -->
        <text id="lblAE" x="100" y="215" font-size="12" fill="#d97706" opacity="0">AE = x</text>
        <text id="lblEF" x="210" y="190" font-size="12" fill="#7c3aed" opacity="0">11 সে.মি.</text>
        <text id="lblBF" x="325" y="215" font-size="12" fill="#059669" opacity="0">20 - x</text>
        <text id="lblH1" x="165" y="145" font-size="13" fill="#dc2626" opacity="0">h</text>
        <text id="lblH2" x="272" y="145" font-size="13" fill="#dc2626" opacity="0">h</text>
      </svg>
    </div>

    <div class="explanation-area">
      <div class="slide-badge" id="slideBadge">স্লাইড ১ / ১০</div>
      <h2 class="slide-title" id="slideTitle">সমস্যা পরিচিতি</h2>
      <div class="slide-body" id="slideBody">
        মনে করি, ABCD একটি ট্রাপিজিয়াম যার সমান্তরাল বাহুদ্বয় AB = 31 সে.মি. এবং CD = 11 সে.মি.।<br>
        অপর দুইটি তীর্যক বাহুর দৈর্ঘ্য যথাক্রমে AD = 10 সে.মি. এবং BC = 12 সে.মি.।
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="changeSlide(-1)">পূর্ববর্তী</button>
    <div class="step-dots" id="dotsContainer"></div>
    <button class="btn" id="nextBtn" onclick="changeSlide(1)">পরবর্তী</button>
  </div>
</div>

<script>
  const slides = [
    {
      title: "১. সমস্যা বিশ্লেষণ ও ট্রাপিজিয়াম গঠন",
      body: "ধরি, ABCD একটি ট্রাপিজিয়াম।<br>এখানে সমান্তরাল বাহুদ্বয়:<br><b>AB = 31 সে.মি.</b> এবং <b>CD = 11 সে.মি.</b><br>অপর বাহুদ্বয়: <b>AD = 10 সে.মি.</b> ও <b>BC = 12 সে.মি.</b>।",
      setup: () => {
        resetSvg();
      }
    },
    {
      title: "২. লম্ব অঙ্কন (উচ্চতা গঠন)",
      body: "C ও D বিন্দু হতে AB বাহুর উপর যথাক্রমে <b>CF</b> এবং <b>DE</b> লম্ব টানি।<br>উভয় লম্বই ট্রাপিজিয়ামের সমান্তরাল বাহুদ্বয়ের মধ্যবর্তী লম্ব দূরত্ব বা উচ্চতা <b>h</b> নির্দেশ করে।",
      setup: () => {
        resetSvg();
        setOpacity('lineDE', 1);
        setOpacity('lineCF', 1);
        setOpacity('lblE', 1);
        setOpacity('lblF', 1);
        setOpacity('rightE', 1);
        setOpacity('rightF', 1);
      }
    },
    {
      title: "৩. আয়তক্ষেত্র CDEF এর মান নির্ধারণ",
      body: "যেহেতু DE ও CF উভয়ই AB এর উপর লম্ব এবং CD || AB, তাই <b>CDEF একটি আয়তক্ষেত্র</b>।<br>সুতরাং, এর বিপরীত বাহুদ্বয় পরস্পর সমান:<br><div class='math-highlight'>EF = CD = 11 সে.মি.</div>এবং ধরি, উচ্চতা <b>DE = CF = h</b>।",
      setup: () => {
        resetSvg();
        setOpacity('lineDE', 1);
        setOpacity('lineCF', 1);
        setOpacity('lblE', 1);
        setOpacity('lblF', 1);
        setOpacity('shadeCdef', 0.15);
        setOpacity('lblEF', 1);
        setOpacity('lblH1', 1);
        setOpacity('lblH2', 1);
      }
    },
    {
      title: "৪. ভূমি অংশ AE ও BF নির্ণয়",
      body: "ধরি, <b>AE = x</b> সে.মি.।<br>আমরা জানি, সম্পূর্ণ বাহু AB = 31 সে.মি.।<br>অতএব, BF = AB - (AE + EF)<br>= 31 - (x + 11)<br><div class='math-highlight'>BF = 20 - x সে.মি.</div>",
      setup: () => {
        resetSvg();
        setOpacity('lineDE', 1);
        setOpacity('lineCF', 1);
        setOpacity('lblE', 1);
        setOpacity('lblF', 1);
        setOpacity('lblEF', 1);
        setOpacity('lblAE', 1);
        setOpacity('lblBF', 1);
      }
    },
    {
      title: "৫. সমকোণী ত্রিভুজ ADE এ পিথাগোরাস প্রয়োগ",
      body: "সমকোণী ত্রিভুজ ADE হতে পাই:<br>AE² + DE² = AD²<br>বা, x² + h² = (10)²<br><div class='math-highlight'>x² + h² = 100  ....... (১)</div>",
      setup: () => {
        resetSvg();
        setOpacity('lineDE', 1);
        setOpacity('lblE', 1);
        setOpacity('lblAE', 1);
        setOpacity('lblH1', 1);
        setOpacity('shadeAde', 0.25);
      }
    },
    {
      title: "৬. সমকোণী ত্রিভুজ BCF এ পিথাগোরাস প্রয়োগ",
      body: "সমকোণী ত্রিভুজ BCF হতে পাই:<br>BF² + CF² = BC²<br>বা, (20 - x)² + h² = (12)²<br><div class='math-highlight'>(20 - x)² + h² = 144  ....... (২)</div>",
      setup: () => {
        resetSvg();
        setOpacity('lineCF', 1);
        setOpacity('lblF', 1);
        setOpacity('lblBF', 1);
        setOpacity('lblH2', 1);
        setOpacity('shadeBcf', 0.25);
      }
    },
    {
      title: "৭. সমীকরণ সমাধান ও x এর মান নির্ণয়",
      body: "(২) নং হতে:<br>400 - 40x + x² + h² = 144<br>বা, 400 - 40x + 100 = 144  [∵ x² + h² = 100]<br>বা, 500 - 40x = 144<br>বা, 40x = 356<br><div class='math-highlight'>x = 356 / 40 = 8.9 সে.মি.</div>",
      setup: () => {
        resetSvg();
        setOpacity('shadeAde', 0.15);
        setOpacity('shadeBcf', 0.15);
        setOpacity('lblAE', 1);
        setOpacity('lblBF', 1);
      }
    },
    {
      title: "৮. উচ্চতা (h) এর মান নির্ণয়",
      body: "(১) নং সমীকরণে x = 8.9 বসিয়ে পাই:<br>(8.9)² + h² = 100<br>বা, 79.21 + h² = 100<br>বা, h² = 100 - 79.21 = 20.79<br>বা, h = √20.79<br><div class='math-highlight'>h ≈ 4.5596 সে.মি.</div>",
      setup: () => {
        resetSvg();
        setOpacity('lineDE', 1);
        setOpacity('lineCF', 1);
        setOpacity('lblH1', 1);
        setOpacity('lblH2', 1);
        document.getElementById('lblH1').textContent = "h ≈ 4.56";
      }
    },
    {
      title: "৯. ক্ষেত্রফলের সূত্রে মান বসানো",
      body: "আমরা জানি, ট্রাপিজিয়ামের ক্ষেত্রফল:<br>= ½ × (সমান্তরাল বাহুদ্বয়ের যোগফল) × উচ্চতা<br>= ½ × (AB + CD) × h<br><div class='math-highlight'>= ½ × (31 + 11) × 4.5596 বর্গ সে.মি.</div>",
      setup: () => {
        resetSvg();
        setOpacity('shadeTrap', 0.2);
        setOpacity('lineDE', 1);
        setOpacity('lblH1', 1);
      }
    },
    {
      title: "১০. চূড়ান্ত ফলাফল",
      body: "ক্ষেত্রফল = ½ × 42 × 4.5596 বর্গ সে.মি.<br>= 21 × 4.5596 বর্গ সে.মি.<br><div class='math-highlight' style='font-size: 1.15rem; color: #166534; background: #dcfce7; border-color: #22c55e;'>= 95.75 বর্গ সে.মি. (প্রায়)</div><br><b>উত্তর:</b> ট্রাপিজিয়ামটির ক্ষেত্রফল ৯৫.৭৫ বর্গ সে.মি. (প্রায়)।",
      setup: () => {
        resetSvg();
        setOpacity('shadeTrap', 0.35);
        setOpacity('lineDE', 1);
        setOpacity('lineCF', 1);
      }
    }
  ];

  let currentSlide = 0;

  function setOpacity(id, val) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', val);
  }

  function resetSvg() {
    setOpacity('lineDE', 0.2);
    setOpacity('lineCF', 0.2);
    setOpacity('lblE', 0.3);
    setOpacity('lblF', 0.3);
    setOpacity('rightE', 0);
    setOpacity('rightF', 0);
    setOpacity('shadeTrap', 0.08);
    setOpacity('shadeAde', 0);
    setOpacity('shadeBcf', 0);
    setOpacity('shadeCdef', 0);
    setOpacity('lblAE', 0);
    setOpacity('lblEF', 0);
    setOpacity('lblBF', 0);
    setOpacity('lblH1', 0);
    setOpacity('lblH2', 0);
    document.getElementById('lblH1').textContent = "h";
  }

  function initDots() {
    const container = document.getElementById('dotsContainer');
    container.innerHTML = '';
    slides.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.className = `dot ${index === currentSlide ? 'active' : ''}`;
      dot.onclick = () => goToSlide(index);
      container.appendChild(dot);
    });
  }

  function renderSlide() {
    const slide = slides[currentSlide];
    document.getElementById('slideBadge').textContent = `স্লাইড ${currentSlide + 1} / ${slides.length}`;
    document.getElementById('slideTitle').textContent = slide.title;
    document.getElementById('slideBody').innerHTML = slide.body;
    document.getElementById('progressBar').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;

    document.getElementById('prevBtn').disabled = currentSlide === 0;
    document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;

    // Update dots
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, index) => {
      dot.classList.toggle('active', index === currentSlide);
    });

    // Run SVG state
    slide.setup();
  }

  function changeSlide(direction) {
    currentSlide += direction;
    if (currentSlide < 0) currentSlide = 0;
    if (currentSlide >= slides.length) currentSlide = slides.length - 1;
    renderSlide();
  }

  function goToSlide(index) {
    currentSlide = index;
    renderSlide();
  }

  // Keyboard navigation support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      if (currentSlide < slides.length - 1) changeSlide(1);
    } else if (e.key === 'ArrowLeft') {
      if (currentSlide > 0) changeSlide(-1);
    }
  });

  // Initialize
  initDots();
  renderSlide();
</script>

</body>
</html>
